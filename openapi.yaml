openapi: 3.0.3

info:
  title: CS453 Project API
  version: 2.0.0
  description: >
    A database-backed REST API for users, projects, and tasks.
    Checkpoint 2 adds password hashing, JWT authentication,
    project ownership, task assignment, and role-based authorization.

servers:
  - url: http://127.0.0.1:3000
    description: Local development server

tags:
  - name: Health
    description: Server and database status
  - name: Authentication
    description: User registration, login, and authenticated identity
  - name: Projects
    description: Authenticated project operations
  - name: Tasks
    description: Authenticated task operations
  - name: Users
    description: Administrator-only user operations

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check server health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /db-health:
    get:
      tags:
        - Health
      summary: Check the PostgreSQL connection
      operationId: getDatabaseHealth
      security: []
      responses:
        "200":
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a normal user
      description: >
        Creates a new account with the user role. A client cannot
        register itself as an administrator.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: example-password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email address is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: An account with that email already exists
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in and receive a JWT
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ada@example.com
              password: example-password
      responses:
        "200":
          description: Credentials verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid email or password
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Return the authenticated JWT identity
      operationId: getAuthenticatedIdentity
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated identity returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags:
        - Projects
      summary: List available projects
      description: >
        Normal users receive projects they own. Administrators receive
        all projects.
      operationId: listProjects
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Projects returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Projects
      summary: Create a project
      description: >
        The authenticated user automatically becomes the project owner.
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: Checkpoint 2
              description: Authentication and authorization work
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags:
        - Projects
      summary: Return one project
      description: >
        A normal user may retrieve a project they own. An administrator
        may retrieve any project.
      operationId: getProjectById
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Project returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks:
    get:
      tags:
        - Tasks
      summary: List available tasks
      description: >
        Normal users receive tasks in projects they own and tasks
        assigned directly to them. Administrators receive all tasks.
      operationId: listTasks
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tasks returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Tasks
      summary: Create a task
      description: >
        A normal user may create a task only in a project they own.
        An administrator may create a task in any project.
      operationId: createTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              title: Finish Checkpoint 2
              description: Complete documentation and testing
              status: in_progress
              projectId: 1
              assignedTo: 1
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"

    get:
      tags:
        - Tasks
      summary: Return one task
      description: >
        A normal user may view a task if they own its project or are
        assigned to the task. An administrator may view any task.
      operationId: getTaskById
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Task returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Tasks
      summary: Update a task
      description: >
        Only the task's project owner or an administrator may update
        the task. Assignment alone does not grant update permission.
      operationId: updateTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
            example:
              status: done
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: >
        Only the task's project owner or an administrator may delete
        the task.
      operationId: deleteTask
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Task deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: >
        Returns all user records without password hashes. This operation
        requires the administrator role.
      operationId: listUsers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated user is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Administrator access required
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /auth/login

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: Positive project identifier
      schema:
        type: integer
        minimum: 1
      example: 1

    TaskId:
      name: id
      in: path
      required: true
      description: Positive task identifier
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    BadRequest:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid request data

    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required

    Forbidden:
      description: The authenticated user lacks permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: You do not have permission to access this resource

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Resource not found

    InternalServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Internal server error

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Authentication required

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: cs453-api

    DatabaseHealthResponse:
      type: object
      required:
        - status
        - database
        - currentTime
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: connected
        currentTime:
          type: string
          format: date-time

    Role:
      type: string
      enum:
        - user
        - admin
      example: user

    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - done
      example: todo

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    AuthIdentity:
      type: object
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: integer
          minimum: 1
          example: 1
        email:
          type: string
          format: email
          example: ada@example.com
        role:
          $ref: "#/components/schemas/Role"

    Project:
      type: object
      required:
        - id
        - name
        - description
        - ownerId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          example: Checkpoint 2
        description:
          type: string
          nullable: true
          example: Authentication and authorization work
        ownerId:
          type: integer
          minimum: 1
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      required:
        - id
        - title
        - description
        - status
        - projectId
        - assignedTo
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        title:
          type: string
          example: Finish Checkpoint 2
        description:
          type: string
          nullable: true
          example: Complete documentation and testing
        status:
          $ref: "#/components/schemas/TaskStatus"
        projectId:
          type: integer
          minimum: 1
          example: 1
        assignedTo:
          type: integer
          minimum: 1
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: example-password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          example: example-password

    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: Checkpoint 2
        description:
          type: string
          nullable: true
          example: Authentication and authorization work

    CreateTaskRequest:
      type: object
      required:
        - title
        - projectId
      properties:
        title:
          type: string
          minLength: 1
          example: Finish Checkpoint 2
        description:
          type: string
          nullable: true
          example: Complete documentation and testing
        status:
          $ref: "#/components/schemas/TaskStatus"
        projectId:
          type: integer
          minimum: 1
          example: 1
        assignedTo:
          type: integer
          minimum: 1
          nullable: true
          example: 1

    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          example: Updated task title
        description:
          type: string
          nullable: true
          example: Updated task description
        status:
          $ref: "#/components/schemas/TaskStatus"
        assignedTo:
          type: integer
          minimum: 1
          nullable: true
          example: 2

    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Signed JSON Web Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthIdentityResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthIdentity"

    ProjectResponse:
      type: object
      required:
        - project
      properties:
        project:
          $ref: "#/components/schemas/Project"

    ProjectListResponse:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"